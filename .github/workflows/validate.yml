name: Validate game
on:
  pull_request:
  push:
    branches: ['fix/arena-scale-animation']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-preview-checks
          path: test-output
